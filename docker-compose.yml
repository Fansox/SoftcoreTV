version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fleet
      - REDIS_URL=redis://redis:6379
      - DATA_PROVIDER=mock
      - APP_TIMEZONE=Europe/Bratislava
      - APP_LOCALE=sk-SK
      - APP_CURRENCY=EUR
      - JWT_SECRET=change_me
    depends_on:
      - db
      - redis
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
